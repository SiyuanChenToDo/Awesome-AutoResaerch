<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">SAGE — Scientific Agent for Grounded Exploration</title>
  <desc id="desc">Research ideas, grounded in evidence. An original evidence-chain emblem and a diagram connecting source papers to a research proposal. A modular research proposal workflow.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c7d7ca"/>
    </pattern>
  </defs>
