  <path d="M744 1h432a23 23 0 0 1 23 23v392a23 23 0 0 1-23 23H744Z" fill="#eef3e9"/>
  <path d="M744 24h432v392H744Z" fill="url(#grid)"/>
  <g transform="translate(48 42) scale(.625)">
