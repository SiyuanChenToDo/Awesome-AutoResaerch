    <text x="48" y="233" font-size="44" font-weight="700" letter-spacing="-1">Research ideas.</text>
    <text x="48" y="285" font-size="44" font-weight="700" letter-spacing="-1">Grounded in evidence.</text>
    <text x="50" y="331" font-size="18" fill="#476355">A modular research proposal workflow.</text>
    <path d="M50 366h632" stroke="#cedbce"/>
    <text x="50" y="399" font-size="13" font-weight="700" letter-spacing="2.5">DISCOVER</text>
    <circle cx="195" cy="394" r="2.5" fill="#93ab98"/>
    <text x="223" y="399" font-size="13" font-weight="700" letter-spacing="2.5">CONNECT</text>
    <circle cx="368" cy="394" r="2.5" fill="#93ab98"/>
    <text x="396" y="399" font-size="13" font-weight="700" letter-spacing="2.5">PROPOSE</text>
