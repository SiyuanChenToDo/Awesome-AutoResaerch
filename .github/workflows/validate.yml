name: Validate SAGE offline workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate SAGE workflow, catalog, templates and regression tests
        run: python scripts/check.py
      - name: Confirm generated catalog is reproducible
        run: |
          python scripts/catalog.py build
          git diff --exit-code -- catalog/
