<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号与模型设置 · SAGE</title><link rel="stylesheet" href="/team.css"></head><body class="account-page"><main class="settings"><a href="/">← 返回科研平台</a><h1>账号与模型设置</h1><p id="identity"></p><p id="message" role="status"></p><section id="bundle-section" class="box" hidden><h2>成果导出</h2><p>下载管理员配置的完整归档。各次运行的原始产物可在科研平台的“最终产物”页下载。</p><a class="button" href="/download/full-export">下载完整归档</a></section><section id="admin" hidden><div class="box"><h2>模型配置</h2><p id="provider-status"></p><p>使用 DeepSeek Flash。密钥保存在服务器私有配置中，不向组员返回。保存不调用付费 API；实际请求在启动研究时发生。</p><form id="provider"><label>DeepSeek API 密钥<input name="key" type="password" autocomplete="off" minlength="16" maxlength="512" required></label><button>保存模型配置</button></form></div><div class="box"><h2>添加组员</h2><p>每位组员都能查看成果、下载和启动研究。新研究会使用服务器配置的模型密钥并产生费用；平台同一时间只启动一个研究任务。</p><form id="new-user"><label>新账号<input name="username" autocomplete="off" pattern="[a-zA-Z0-9_-]{3,40}" required></label><label>初始密码（至少 12 位）<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button>创建组员账号</button></form><p id="users"></p></div></section><section class="box"><h2>修改自己的密码</h2><form id="password"><label>当前密码<input name="current_password" type="password" autocomplete="current-password" required></label><label>新密码<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button>保存并重新登录</button></form></section></main><script src="/settings.js" defer></script></body></html>
