<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SAGE · 科研观察台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/planner.css"><link rel="stylesheet" href="/reading.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="/">SAGE<span>RESEARCH CONSOLE</span></a><button id="new" class="primary">＋ 新建研究</button><div class="side-label">研究记录 <button id="refresh" title="刷新研究记录">↻</button></div><nav id="runs" aria-label="研究记录"></nav><footer>从问题到可检验的猜想<br>每一步都有可追溯的产物</footer></aside>
<main><header><span class="eyebrow">科研观察台</span><span id="connection" role="status">连接中…</span></header>
<section id="login" hidden><h1>连接观察台</h1><p>在服务器启动命令输出的地址中找到访问令牌。它用于访问此平台，与模型 API key 无关。</p><form id="auth-form"><label>平台访问令牌<input id="token" type="password" autocomplete="off" required></label><button class="primary">连接</button></form></section>
<section id="create" hidden><div class="page-heading"><p class="eyebrow">NEW RESEARCH</p><h1>一个问题，开始一次探索。</h1><p>输入研究方向或具体瓶颈。系统会检索文献、构建证据、生成候选，并组织讨论与评阅。</p></div>
<section id="planner" class="panel planner" aria-labelledby="planner-title"><p id="planner-progress" class="eyebrow"></p><h2 id="planner-title" tabindex="-1"></h2><div id="planner-body"></div></section>
<form id="launch-form" class="panel" hidden><div class="planner-review"><h2>确认研究输入</h2><p id="plan-summary" class="subtle"></p><div class="planner-actions"><button id="planner-reopen" type="button">← 修改规划</button><button id="planner-download" type="button">下载规划草稿</button></div></div><label for="topic">研究问题 / Topic</label><textarea id="topic" rows="7" maxlength="20000" required placeholder="例如：大语言模型在数学构造中，如何维护多步约束状态？希望提出可通过开放权重模型干预验证的机制假说。"></textarea><div class="form-grid"><label>研究者<select id="researchers"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label><label>讨论轮数<select id="discussion_rounds"><option>1</option><option selected>2</option><option>3</option></select></label><label>正式评分上限<input id="max_attempts" type="number" min="1" max="4" value="4"></label><label>研究工具上限<input id="max_tools" type="number" min="1" max="640" value="640"></label><label>时间预算（分钟）<input id="minutes" type="number" min="1" max="120" value="120"></label></div><div class="notice">使用服务器已配置的模型与密钥。当前入口产出科研猜想和实验方案；实验执行与论文写作尚未接通。</div><label class="checkbox"><input type="checkbox" id="live-consent" required><span>启动真实模型调用，按上述预算运行</span></label><div class="form-bottom"><span id="start-error" role="alert"></span><button id="start" class="primary">开始研究 →</button></div></form></section>
<section id="workspace" hidden><div class="page-heading"><div class="title-line"><p class="eyebrow" id="run-id"></p><span id="status" class="badge"></span></div><h1 id="run-title"></h1><details class="topic-details"><summary>查看完整输入</summary><p id="full-topic"></p></details><div id="run-meta" class="meta"></div></div><div id="metrics" class="metrics"></div><ol id="stages" class="stages" aria-label="科研阶段"></ol><div class="review-boundary">当前为自主猜想流程 · 模型评分属于建议性评阅 · 独立科学验收与真实实验另行验证</div><nav id="tabs" class="tabs" aria-label="产物视图"></nav><div id="content" aria-live="polite"></div></section>
<div id="error" class="error" role="alert" hidden></div>
</main><script src="/planner.js" defer></script><script src="/planner-ui.js" defer></script><script src="/reading.js" defer></script><script src="/reading-ui.js" defer></script><script src="/app.js" defer></script></body></html>
